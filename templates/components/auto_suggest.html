<!-- Global ERP Search Auto-Suggestion Component -->
<style>
    .erp-suggest-dropdown {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + 6px);
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(226, 232, 240, 0.9);
        border-radius: 16px;
        box-shadow: 0 16px 36px -6px rgba(15, 23, 42, 0.14), 0 0 0 1px rgba(15, 23, 42, 0.04);
        max-height: 360px;
        overflow-y: auto;
        z-index: 60;
        display: none;
    }
    .erp-suggest-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 9px 14px;
        cursor: pointer;
        transition: all 0.15s ease;
        border-left: 3px solid transparent;
    }
    .erp-suggest-item:hover,
    .erp-suggest-item.erp-active {
        background-color: #f0f5ff;
        border-left-color: #283891;
    }
    .erp-suggest-highlight {
        font-weight: 700;
        color: #283891;
        background: #e0ecff;
        padding: 1px 3px;
        border-radius: 4px;
    }
    .erp-search-spinner {
        display: none;
        width: 14px;
        height: 14px;
        border: 2px solid #cbd5e1;
        border-top-color: #283891;
        border-radius: 50%;
        animation: erp-spin 0.6s linear infinite;
    }
    @keyframes erp-spin {
        to { transform: rotate(360deg); }
    }
</style>

<script>
(function() {
    'use strict';

    function getScopeForInput(input) {
        if (input.dataset.autosuggest) {
            return input.dataset.autosuggest.trim();
        }
        const path = window.location.pathname;
        if (path.includes('/inventory/medicines/')) return 'medicines';
        if (path.includes('/inventory/master-catalog/')) return 'master_catalog';
        if (path.includes('/inventory/categories/')) return 'categories';
        if (path.includes('/inventory/units/')) return 'units';
        if (path.includes('/stores/')) return 'stores';
        if (path.includes('/accounts/store-admins/')) return 'store_admins';
        if (path.includes('/accounts/staff/')) return 'staff';
        if (path.includes('/billing/invoices/')) return 'invoices';
        return null;
    }

    function highlightMatch(text, query) {
        if (!query) return text;
        const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`(${escaped})`, 'gi');
        return text.replace(regex, '<span class="erp-suggest-highlight">$1</span>');
    }

    function getCategoryIcon(category) {
        switch (category) {
            case 'Product':
                return '<svg class="w-3.5 h-3.5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>';
            case 'Catalog':
                return '<svg class="w-3.5 h-3.5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>';
            case 'Category':
                return '<svg class="w-3.5 h-3.5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>';
            case 'Unit':
                return '<svg class="w-3.5 h-3.5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"></path></svg>';
            case 'Store':
                return '<svg class="w-3.5 h-3.5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>';
            case 'Store Admin':
            case 'Staff':
                return '<svg class="w-3.5 h-3.5 text-cyan-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>';
            case 'Invoice':
                return '<svg class="w-3.5 h-3.5 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 14l6-6m-5.5.5h.01m4.99 5h.01M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16l3.5-2 3.5 2 3.5-2 3.5 2zM10 8.5a.5.5 0 11-1 0 .5.5 0 011 0zm5 5a.5.5 0 11-1 0 .5.5 0 011 0z"></path></svg>';
            default:
                return '<svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>';
        }
    }

    function initAutoSuggest(input) {
        const scope = getScopeForInput(input);
        if (!scope) return;

        input.setAttribute('autocomplete', 'off');

        // Ensure parent container is relative
        let container = input.parentElement;
        if (!container.classList.contains('relative')) {
            container.classList.add('relative');
        }

        // Add spinner indicator inside container if not present
        let rightControls = container.querySelector('.erp-search-controls');
        if (!rightControls) {
            rightControls = document.createElement('div');
            rightControls.className = 'erp-search-controls absolute right-3 top-2.5 flex items-center space-x-1.5 pointer-events-none';
            rightControls.innerHTML = `
                <div class="erp-search-spinner"></div>
                <button type="button" class="erp-clear-btn hidden pointer-events-auto text-slate-400 hover:text-slate-600 p-0.5 rounded-full hover:bg-slate-100 transition" title="Clear search">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            `;
            container.appendChild(rightControls);
        }

        const spinner = rightControls.querySelector('.erp-search-spinner');
        const clearBtn = rightControls.querySelector('.erp-clear-btn');

        // Update clear button visibility
        function toggleClearBtn() {
            if (input.value.trim().length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
        }
        toggleClearBtn();

        clearBtn.addEventListener('click', (e) => {
            e.preventDefault();
            input.value = '';
            toggleClearBtn();
            hideDropdown();
            input.focus();
            if (input.form) {
                input.form.submit();
            }
        });

        // Create Dropdown
        let dropdown = container.querySelector('.erp-suggest-dropdown');
        if (!dropdown) {
            dropdown = document.createElement('div');
            dropdown.className = 'erp-suggest-dropdown';
            container.appendChild(dropdown);
        }

        let abortController = null;
        let debounceTimer = null;
        let activeIndex = -1;
        let currentSuggestions = [];

        function showDropdown() {
            dropdown.style.display = 'block';
        }

        function hideDropdown() {
            dropdown.style.display = 'none';
            activeIndex = -1;
        }

        function renderSuggestions(items, query) {
            currentSuggestions = items;
            activeIndex = -1;

            if (!items || items.length === 0) {
                dropdown.innerHTML = `
                    <div class="px-4 py-3.5 text-center text-xs text-slate-400 font-medium">
                        No matches found for "<span class="text-slate-700 font-semibold">${escapeHtml(query)}</span>"
                    </div>
                `;
                showDropdown();
                return;
            }

            let html = `
                <div class="px-3.5 py-1.5 bg-slate-50/80 border-b border-slate-100 flex items-center justify-between text-[10px] font-bold text-slate-400 uppercase tracking-wider">
                    <span>Suggestions (${items.length})</span>
                    <span class="text-[9px] font-medium text-slate-400 lowercase">↑↓ to navigate • enter to select</span>
                </div>
                <div class="divide-y divide-slate-100/70">
            `;

            items.forEach((item, idx) => {
                const highlightedTitle = highlightMatch(item.title, query);
                const icon = getCategoryIcon(item.category);
                html += `
                    <div class="erp-suggest-item" data-index="${idx}" data-val="${escapeHtml(item.value)}">
                        <div class="flex items-center space-x-2.5 min-w-0 pr-3">
                            <div class="w-6 h-6 rounded-lg bg-slate-100 flex items-center justify-center flex-shrink-0">
                                ${icon}
                            </div>
                            <div class="min-w-0">
                                <div class="text-xs font-semibold text-slate-800 truncate">${highlightedTitle}</div>
                                ${item.subtitle ? `<div class="text-[11px] text-slate-400 truncate">${escapeHtml(item.subtitle)}</div>` : ''}
                            </div>
                        </div>
                        ${item.badge ? `<div class="flex-shrink-0 text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200/60">${escapeHtml(item.badge)}</div>` : ''}
                    </div>
                `;
            });

            html += `</div>`;
            dropdown.innerHTML = html;
            showDropdown();

            // Bind click handlers to items
            const itemEls = dropdown.querySelectorAll('.erp-suggest-item');
            itemEls.forEach(el => {
                el.addEventListener('mousedown', (e) => {
                    e.preventDefault(); // prevent blur before selection
                    selectItem(el.dataset.val);
                });
                el.addEventListener('mouseenter', () => {
                    const idx = parseInt(el.dataset.index, 10);
                    setActiveIndex(idx);
                });
            });
        }

        function setActiveIndex(idx) {
            const itemEls = dropdown.querySelectorAll('.erp-suggest-item');
            itemEls.forEach(el => el.classList.remove('erp-active'));
            activeIndex = idx;
            if (activeIndex >= 0 && activeIndex < itemEls.length) {
                const activeEl = itemEls[activeIndex];
                activeEl.classList.add('erp-active');
                activeEl.scrollIntoView({ block: 'nearest' });
            }
        }

        function selectItem(val) {
            input.value = val;
            toggleClearBtn();
            hideDropdown();
            if (input.form) {
                input.form.submit();
            }
        }

        function fetchSuggestions(query) {
            if (abortController) {
                abortController.abort();
            }
            abortController = new AbortController();

            spinner.style.display = 'block';

            const url = `/core/suggestions/?scope=${encodeURIComponent(scope)}&q=${encodeURIComponent(query)}`;

            fetch(url, { signal: abortController.signal })
                .then(res => res.json())
                .then(data => {
                    spinner.style.display = 'none';
                    renderSuggestions(data.suggestions || [], query);
                })
                .catch(err => {
                    if (err.name !== 'AbortError') {
                        spinner.style.display = 'none';
                    }
                });
        }

        input.addEventListener('input', () => {
            const val = input.value.trim();
            toggleClearBtn();

            clearTimeout(debounceTimer);
            if (val.length < 1) {
                if (abortController) abortController.abort();
                spinner.style.display = 'none';
                hideDropdown();
                return;
            }

            debounceTimer = setTimeout(() => {
                fetchSuggestions(val);
            }, 180);
        });

        input.addEventListener('keydown', (e) => {
            const itemEls = dropdown.querySelectorAll('.erp-suggest-item');
            if (dropdown.style.display === 'block' && itemEls.length > 0) {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    let next = activeIndex + 1;
                    if (next >= itemEls.length) next = 0;
                    setActiveIndex(next);
                    return;
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    let prev = activeIndex - 1;
                    if (prev < 0) prev = itemEls.length - 1;
                    setActiveIndex(prev);
                    return;
                } else if (e.key === 'Enter') {
                    if (activeIndex >= 0 && activeIndex < itemEls.length) {
                        e.preventDefault();
                        selectItem(itemEls[activeIndex].dataset.val);
                        return;
                    }
                } else if (e.key === 'Escape') {
                    hideDropdown();
                    return;
                }
            }
        });

        input.addEventListener('focus', () => {
            const val = input.value.trim();
            if (val.length >= 1 && currentSuggestions.length > 0) {
                showDropdown();
            }
        });

        document.addEventListener('click', (e) => {
            if (!container.contains(e.target)) {
                hideDropdown();
            }
        });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    // Auto-initialize on DOM ready
    document.addEventListener('DOMContentLoaded', () => {
        const searchInputs = document.querySelectorAll('input[data-autosuggest], input[name="q"]');
        searchInputs.forEach(input => initAutoSuggest(input));
    });
})();
</script>
