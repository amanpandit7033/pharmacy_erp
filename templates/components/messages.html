{% if messages %}
<div id="messages-container" class="fixed top-4 right-0 left-0 sm:left-auto sm:right-5 z-50 flex flex-col space-y-3 sm:max-w-md w-full px-4 pointer-events-none">
    {% for message in messages %}
    <div class="toast-message pointer-events-auto flex items-start p-4 rounded-2xl shadow-xl border backdrop-blur-md transition-all duration-500 transform translate-y-0 opacity-100 scale-100
        {% if message.tags == 'error' %}
            bg-rose-50/95 border-rose-200 text-rose-900 shadow-rose-500/10
        {% elif message.tags == 'warning' %}
            bg-amber-50/95 border-amber-200 text-amber-900 shadow-amber-500/10
        {% elif message.tags == 'info' %}
            bg-blue-50/95 border-blue-200 text-blue-900 shadow-blue-500/10
        {% else %}
            bg-emerald-50/95 border-emerald-200 text-emerald-900 shadow-emerald-500/10
        {% endif %}">
        <div class="flex-shrink-0 mr-3 mt-0.5">
            {% if message.tags == 'error' %}
            <div class="w-7 h-7 rounded-xl bg-rose-100 text-rose-600 flex items-center justify-center">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            {% elif message.tags == 'warning' %}
            <div class="w-7 h-7 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
            </div>
            {% elif message.tags == 'info' %}
            <div class="w-7 h-7 rounded-xl bg-blue-100 text-[#283891] flex items-center justify-center">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            {% else %}
            <div class="w-7 h-7 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            {% endif %}
        </div>
        <div class="flex-1 text-xs font-semibold leading-relaxed pt-1">
            {{ message }}
        </div>
        <button type="button" onclick="dismissToast(this.closest('.toast-message'))" class="ml-3 flex-shrink-0 text-slate-400 hover:text-slate-600 focus:outline-none transition p-1" title="Close">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    </div>
    {% endfor %}
</div>

<script>
    function dismissToast(el) {
        if (!el) return;
        el.classList.add('opacity-0', '-translate-y-2', 'scale-95');
        setTimeout(function() {
            el.remove();
        }, 500);
    }

    function initToastAutoDismiss() {
        const toasts = document.querySelectorAll('.toast-message');
        toasts.forEach(function(toast) {
            setTimeout(function() {
                dismissToast(toast);
            }, 3000);
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initToastAutoDismiss);
    } else {
        initToastAutoDismiss();
    }
</script>
{% endif %}
